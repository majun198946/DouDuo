name: Build Unsigned IPA

# 云端编译未签名 IPA：项目使用了 iOS 27 / 27.1 才有的新 SwiftUI API
# （toolbarVerticalEdge、reservedRegions、@ContentBuilder 等），
# 必须用 Xcode 27（iOS 27.x SDK）编译。xcode-27 runner 自带 Xcode 27。
# 产物是未签名 IPA，下载后仍需自行签名（爱思助手 / 全能签）。

on:
  workflow_dispatch:        # 手动在 Actions 页点运行
  push:
    tags:
      - 'v*'               # 打 tag 也自动编

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache VLCKit
        id: cache-vlc
        uses: actions/cache@v4
        with:
          path: Vendor/VLCKit/VLCKit-all.xcframework
          key: vlckit-3.6.0-${{ hashFiles('scripts/fetch-vlckit.sh') }}

      - name: Fetch VLCKit
        if: steps.cache-vlc.outputs.cache-hit != 'true'
        run: ./scripts/fetch-vlckit.sh

      - name: List & select Xcode 27.2
        run: |
          echo "=== 所有已安装 Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null
          echo "=== 默认 xcodebuild 版本 ==="
          xcodebuild -version 2>&1 | head -2
          echo "=== 尝试切到 Xcode 27.2 ==="
          if [ -d "/Applications/Xcode_27.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
            echo "已切换到 Xcode 27.2"
          elif command -v xcodes >/dev/null 2>&1; then
            echo "xcodes 可用，尝试列出可装版本"
            xcodes list 2>&1 | head -20 || echo "xcodes list 失败"
          else
            echo "无 Xcode 27.2，也无 xcodes"
          fi
          echo "=== 切换后 xcodebuild 版本 ==="
          xcodebuild -version 2>&1 | head -2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          VER=$(grep -E '^ +MARKETING_VERSION:' project.yml | head -1 | awk '{print $2}')
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/DouDuo.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../DouDuo-$VER-unsigned.ipa Payload)
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-${{ env.VERSION }}-unsigned
          path: build/DouDuo-${{ env.VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
